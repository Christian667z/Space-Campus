[package]
name = "asta-campus-desktop"
version = "2.0.0"
description = "Asta Campus - Plateforme Académique & Sécurisée UNASMOH"
authors = ["Christian Alvaro <christian7alvaro@gmail.com>"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = "0.10"
aes-gcm = "0.10"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
base64 = "0.22"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[lib]
name = "asta_core"
crate-type = ["staticlib", "cdylib", "rlib"]
