[package]
name = "asta-cli"
version = "2.0.0"
authors = ["Christian Alvaro <christian7alvaro@gmail.com>"]
edition = "2021"
description = "Outil en ligne de commande Rust pour l'administration et la maintenance (remplaçant scripts/*.py)"

[dependencies]
asta-core = { path = "../asta-core" }
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
