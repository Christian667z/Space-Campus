[package]
name = "asta-core"
version = "2.0.0"
authors = ["Christian Alvaro <christian7alvaro@gmail.com>"]
edition = "2021"
description = "Cœur métier et logique académique d'Asta Campus (remplaçant core/*.py)"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
aes-gcm = "0.10"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
base64 = "0.22"
regex = "1.10"

# SQLite : bundled (compile depuis les sources C) activé via feature
# Pour compiler avec GNU target sans GCC : cargo check --no-default-features
# Pour MSVC (production) : feature bundled active par défaut
rusqlite = { version = "0.31", optional = false }

[features]
# Feature bundled : compile SQLite depuis les sources C (nécessite GCC ou MSVC)
# Activé par défaut pour la production (MSVC) — désactivé pour tests GNU sans GCC
bundled-sqlite = ["rusqlite/bundled"]
default = ["bundled-sqlite"]
